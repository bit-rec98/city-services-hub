services:
  # PostgreSQL para los microservicios
  postgres:
    image: postgres:15-alpine
    container_name: cityservices-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      # Contraseñas de los roles por servicio que crea scripts/init-databases.sh
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      APPOINTMENTS_DB_PASSWORD: ${APPOINTMENTS_DB_PASSWORD:?Set APPOINTMENTS_DB_PASSWORD in .env}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Set NOTIFICATIONS_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityservices-network

  # Redis para caché distribuido
  redis:
    image: redis:7-alpine
    container_name: cityservices-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityservices-network

  # RabbitMQ para mensajería
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cityservices-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityservices-network

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: cityservices-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      # appsettings.json apunta a localhost (desarrollo sin Docker); dentro de la red del compose
      # los servicios se alcanzan por su nombre.
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity__Address=http://identity-api:80
      - ReverseProxy__Clusters__appointments-cluster__Destinations__appointments__Address=http://appointments-api:80
    ports:
      - "5000:80"
    depends_on:
      - identity-api
      - appointments-api
    networks:
      - cityservices-network

  # Identity API
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: cityservices-identity
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=identity_db;Username=identity_user;Password=${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      - Database__MigrateOnStartup=true
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5001:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cityservices-network

  # Medical Appointments API
  appointments-api:
    build:
      context: .
      dockerfile: src/Services/MedicalAppointments/MedicalAppointments.API/Dockerfile
    container_name: cityservices-appointments
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MedicalAppointmentsDb=Host=postgres;Port=5432;Database=medical_appointments_db;Username=appointments_user;Password=${APPOINTMENTS_DB_PASSWORD:?Set APPOINTMENTS_DB_PASSWORD in .env}
      - Database__MigrateOnStartup=true
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ConnectionStrings__Redis=redis:6379
    ports:
      - "5002:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cityservices-network

  # Frontend React
  frontend:
    build:
      context: ./src/WebApp
      dockerfile: Dockerfile
    container_name: cityservices-frontend
    ports:
      - "3000:80"
    depends_on:
      - apigateway
    networks:
      - cityservices-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  cityservices-network:
    driver: bridge
