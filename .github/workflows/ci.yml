name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Permisos mínimos por defecto
permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Build y test del backend
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore CityServicesHub.sln
    
    - name: Build solution
      run: dotnet build CityServicesHub.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test CityServicesHub.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: github.event_name == 'pull_request'
      with:
        directory: ./coverage
        fail_ci_if_error: false
        verbose: true

  # Build del frontend
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    defaults:
      run:
        working-directory: ./src/WebApp
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./src/WebApp/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
      continue-on-error: true
    
    - name: Build
      run: npm run build

  # Docker build
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API Gateway
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/ApiGateway/Dockerfile
        push: false
        tags: city-services-hub/api-gateway:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Identity API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Services/Identity/Identity.API/Dockerfile
        push: false
        tags: city-services-hub/identity-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Medical Appointments API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Services/MedicalAppointments/MedicalAppointments.API/Dockerfile
        push: false
        tags: city-services-hub/appointments-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./src/WebApp
        file: ./src/WebApp/Dockerfile
        push: false
        tags: city-services-hub/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore CityServicesHub.sln
    
    - name: Check code formatting
      run: dotnet format CityServicesHub.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true
